<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudRS 图片标注</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>CloudRS 图片标注</h1>
        <p id="csv-name" class="muted"></p>
      </div>
      <div id="save-status" class="save-status" role="status" aria-live="polite">正在加载…</div>
    </header>

    <main class="app-layout">
      <section class="viewer-panel" aria-label="图片查看器">
        <div class="viewer-toolbar">
          <div class="button-group">
            <button id="previous-button" type="button" title="上一张（←）">← 上一张</button>
            <button id="next-button" type="button" title="下一张（→）">下一张 →</button>
          </div>
          <strong id="position">- / -</strong>
          <div class="button-group">
            <button id="zoom-out-button" type="button" title="缩小（-）">−</button>
            <button id="fit-button" type="button">适应窗口</button>
            <button id="actual-size-button" type="button">100%</button>
            <button id="zoom-in-button" type="button" title="放大（+）">＋</button>
          </div>
        </div>
        <div id="image-viewport" class="image-viewport" aria-label="可缩放、可拖动的待标注图片">
          <img id="annotation-image" alt="待标注图像" draggable="false" />
          <p id="missing-image" class="missing-image" hidden>找不到对应 PNG 图片。</p>
        </div>
        <div class="tile-footer">
          <span id="tile-id">—</span>
          <span id="completion-summary" class="muted">—</span>
        </div>
      </section>

      <aside class="annotation-panel" aria-label="标注面板">
        <div class="panel-heading">
          <div>
            <h2>label_set</h2>
            <p class="muted">当前图的标签与备注</p>
          </div>
          <button id="reload-labels-button" type="button" title="重新读取本地 label_set.csv">更新 label_set</button>
        </div>

        <label class="toggle-row" for="multi-select-toggle">
          <input id="multi-select-toggle" type="checkbox" />
          <span>启用双标签（最多两个）</span>
        </label>
        <p id="multi-select-hint" class="hint">默认单选。启用后仅可选择配置允许的两个语义标签。</p>

        <div id="label-options" class="label-options" role="group" aria-label="标签选项"></div>
        <p id="label-warning" class="warning" hidden></p>
        <button id="clear-labels-button" class="text-button" type="button">清空标签（标为未完成）</button>

        <label class="notes-field" for="notes">
          <span>notes</span>
          <textarea id="notes" rows="7" maxlength="10000" placeholder="可选备注；会自动保存"></textarea>
        </label>
        <div class="panel-actions">
          <button id="save-button" class="primary" type="button">立即保存</button>
          <button id="next-unfinished-button" type="button">下一张未完成</button>
        </div>
        <p class="keyboard-hint">快捷键：←/→ 切图，+/- 缩放，F 适应窗口。</p>
      </aside>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
