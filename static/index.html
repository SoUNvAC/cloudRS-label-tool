<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudRS Phase 工作导航</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body class="navigation-body">
    <main class="navigation-shell">
      <header class="navigation-header">
        <div>
          <p class="eyebrow">CLOUDRS LABEL TOOL</p>
          <h1>Phase 工作导航</h1>
          <p id="phase-root" class="muted">正在读取 phase 目录…</p>
        </div>
        <div id="navigation-status" class="save-status" role="status" aria-live="polite">正在加载…</div>
      </header>

      <section class="navigation-card phase-overview">
        <div>
          <h2>当前 Phase</h2>
          <p id="phase-summary" class="muted">—</p>
        </div>
        <div class="mode-guide">
          <span>1. 独立完成 calibration</span>
          <span>2. 共识裁决 calibration</span>
          <span>3. 独立完成 confirmation</span>
        </div>
      </section>

      <section class="navigation-grid">
        <section class="navigation-card workspace-selector">
          <div class="section-heading">
            <div>
              <h2>选择工作区</h2>
              <p class="muted">每次只打开一份工作 CSV。</p>
            </div>
          </div>

          <fieldset class="mode-selector">
            <legend>模式</legend>
            <label><input type="radio" name="workspace-mode" value="review" checked /> 独立评审</label>
            <label><input type="radio" name="workspace-mode" value="consensus" /> 共识裁决（A/B/共识三文件）</label>
            <label><input type="radio" name="workspace-mode" value="single_file_consensus" /> 共识裁决（单文件）</label>
          </fieldset>

          <div id="review-fields" class="workspace-fields">
            <label for="review-csv">Reviewer CSV
              <select id="review-csv"></select>
            </label>
          </div>

          <div id="consensus-fields" class="workspace-fields" hidden>
            <label for="reviewer-a-csv">Reviewer A CSV
              <select id="reviewer-a-csv"></select>
            </label>
            <label for="reviewer-b-csv">Reviewer B CSV
              <select id="reviewer-b-csv"></select>
            </label>
            <label for="consensus-csv">最终共识 CSV
              <select id="consensus-csv"></select>
            </label>
          </div>

          <div id="single-consensus-fields" class="workspace-fields" hidden>
            <label for="single-consensus-csv">单文件合并 CSV
              <select id="single-consensus-csv"></select>
            </label>
          </div>

          <label for="labels-csv">label_set 配置
            <select id="labels-csv"></select>
          </label>
          <button id="open-workspace-button" class="primary open-workspace" type="button">进入工作区</button>
          <p class="keyboard-hint">导航页只选择工作文件和预览配置；写入只会发生在进入工作区后的保存操作。</p>
        </section>

        <section class="navigation-card label-preview-card">
          <div class="section-heading">
            <div>
              <h2>label_set 预览</h2>
              <p id="label-preview-summary" class="muted">—</p>
            </div>
            <button id="refresh-navigation-button" type="button">刷新文件列表</button>
          </div>
          <div id="label-preview" class="label-preview" aria-live="polite"></div>
        </section>
      </section>

      <section class="navigation-card csv-inventory-card">
        <div class="section-heading">
          <div>
            <h2>Phase 文件清单</h2>
            <p class="muted">仅显示当前 --data-dir 目录根部的 CSV。</p>
          </div>
        </div>
        <div class="inventory-table-wrap">
          <table>
            <thead><tr><th>文件</th><th>识别类型</th><th>记录数</th><th>列</th></tr></thead>
            <tbody id="csv-inventory"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/static/navigation.js"></script>
  </body>
</html>
